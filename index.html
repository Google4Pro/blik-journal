мантичность. Я очень тонко чувствую окружающий мир. Однажды, прогуливаясь по Сеулу, я увидел падающий с дерева лист и… на глаза навернулись слёзы… не потому что я опоздал на запись альбома (смеётся), а потому что… рано или поздно мы вынуждены учиться отпускать… то, за что так отчаянно цепляемся… и в такие моменты обычно понимаем, что было действительно важно."}),d.jsx(ft,{className:"prose-italics",children:"Он на секунду смолкает. За окном — что-то похожее на ночной город. Или просто темнота."})]}),d.jsxs(Uu,{id:"ch2",variant:"rose",bg:"linear-gradient(160deg, #0a0806d8 0%, #1a0f0ae8 100%), url('https://images.pexels.com/photos/17312354/pexels-photo-17312354.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600') center/cover",children:[d.jsx(Ka,{num:"Глава II",title:"Все дороги ведут в Рим"}),d.jsx(ft,{children:"Когда он говорит об Италии, в его голосе появляется что-то новое. Не ностальгия в привычном смысле — скорее, особая бережность. Так говорят о месте, которое изменило тебя изнутри, не спросив разрешения."}),d.jsx(Oe,{place:"rome",caption:"Ночной Рим. Камень, вода и свет, который не гаснет."}),d.jsx(Z,{children:"— Вы учились в Италии. Каким предстал перед Вами Рим, когда Вы впервые увидели его?"}),d.jsx(V,{children:"— Ох… молчаливым, но многословным. Рим подобен старику, знающему столько легенд, но рассказывающему их вам своими улицами, архитектурой и журчанием фонтанов. Гуляя по этим вымощенным булыжниками площадям, представляя все те тысячи судеб, что им довелось увидеть, понимаешь, что… ты всего лишь крохотная нотка в этом бесконечном океане музыки."}),d.jsx(Z,{children:"— Что Италия изменила в вашем характере, взглядах или отношении к жизни? Был ли в Италии момент, который особенно сильно повлиял на вас как на человека?"}),d.jsx(V,{children:"— Если коротко, то буквально всё. В Италии… моё сердце впервые забилось в такт.. к сожалению, там же мне его и разбили. В конце концов, именно Италия сделала меня таким, каким я сегодня предстаю перед вами. А Тибр… ему довелось увидеть мои самые сокровенные моменты радости и грусти… но знаете, что важно? Он всё так же продолжает течь, не останавливаясь ни на минуту. Это тоже многое говорит о жизни…"}),d.jsx(Aa,{children:"В Италии моё сердце впервые забилось в такт. К сожалению, там же мне его и разбили."}),d.jsx(Z,{children:"— Какие итальянские привычки или традиции остались с вами до сих пор?"}),d.jsx(V,{children:"— Я все еще неплохо знаю язык и кухню. На моем столе до сих пор мирно соседствуют кимпаб и лазанья. Возможно, я незаконно вывез из этой страны привычку есть не спеша, наслаждаясь каждым кусочком… точно так же надо слушать музыку… медленно и с наслаждением."}),d.jsx(Z,{children:"— Повлияли ли итальянская культура, архитектура, искусство или музыка на ваше творчество?"}),d.jsx(V,{children:"— Безусловно, музыкальные вкусы, манера пения… я многое заимствовал из этой прекрасной страны… один дедушка, итальянский пастух, который обладал голосом невероятной красоты, однажды рассказал мне легенду о происхождении нот, будто бы слова итальянского разбились на части и превратились в прекрасные звуки… и хотя ноты существовали задолго до итальянского… мне нравится верить в эту легенду."}),d.jsx(Z,{children:"— Где вы чувствовали себя более свободным — в Италии или на сцене перед тысячами поклонников?"}),d.jsx(V,{children:"— Я бы задал вопрос иначе: где я чувствовал себя счастливым… Там, на берегах Тибра, я впервые познал счастье, однако… великое наслаждение часто идет рука об руку с великим страданием… а сцена… пусть на мгновение… но возвращает меня в те сладкие мгновения моей жизни."})]}),d.jsxs(Uu,{id:"ch3",variant:"darker",bg:"linear-gradient(160deg, #06060aee 0%, #0a0812f0 100%), url('https://images.pexels.com/photos/39471112/pexels-photo-39471112.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=900&w=1600') center/cover",children:[d.jsx(Ka,{num:"Глава III",title:"Голос, у которого есть душа"}),d.jsx(ft,{children:"Если спросить у тех, кто слышал его вживую, что именно их зацепило, большинство скажет: не нота, не приём — а ощущение, что он поёт прямо тебе. Не аудитории. Тебе лично."}),d.jsx(Oe,{place:"match",caption:"Одна искра — и тишина на мгновение становится светом."}),d.jsx(Z,{children:"— Когда вы впервые поняли, что пение — это не просто талант, а важная часть вашей личности?"}),d.jsx(V,{children:"— Наверное, на центральной площади Рима… момент, когда запела моя душа, мне никогда не забыть. Не буду погружать вас в обстоятельства, скажу лишь… та площадь и та песня… навсегда останутся в моём сердце."}),d.jsx(Z,{children:"— Что вы хотите, чтобы слушатель почувствовал, когда слышит ваш голос?"}),d.jsx(V,{children:"— Душу, то, что она у меня все же есть. И наверное надежду, ведь она так нужна нам порой. Какой бы красивой ни была техника, сыграть на струнах души слушателей сможет лишь внутренний огонь. Пусть он горит!"}),d.jsx(Z,{children:"— Как вы описали бы свой вокал человеку, который ещё никогда вас не слышал?"}),d.jsx(V,{children:"— Я бы предложил ему выпить чай с лимоном, а лучше лаймом. А после назвал бы это своим вокалом. Пусть ему или ей… тому, кто слушает меня… станет лучше, станет светлее. Даже если я пою о боли, пусть она сделает слушающих… сильнее."}),d.jsx(Aa,{children:"Иначе это будет не пение, а всего лишь техническое исполнение."}),d.jsx(Z,{children:"— Есть ли песня, которую вам особенно трудно исполнять эмоционально?"}),d.jsx(V,{children:"— Есть… и возможно, моя аудитория однажды ее услышит. Однако пока… я не готов её выпустить… пусть она, как хорошее вино, хорошенько настоится… а после, когда придет время, я обязательно поделюсь ею с вами."}),d.jsx(Z,{children:"— Как вы заботитесь о своём голосе во время напряжённого графика, концертов и перелётов?"}),d.jsx(V,{children:"— Знаете, я никогда не испытывал с этим больших проблем. Возможно, дело в том, что мой голос поставлен по методам старой итальянской школы. Мои братья по группе иногда обращаются ко мне за советом."}),d.jsx(Z,{children:"— Бывает ли, что ваши личные переживания меняют звучание песни?"}),d.jsx(V,{children:"— Я бы сказал так: не «бывает, что меняет», а должно менять, иначе… это будет не пение, а техническое исполнение. Я не имею право обманывать слушателя, и поэтому… в каждой песне… проживаю то, о чём пою, заново."}),d.jsx(Z,{children:"— Какую песню вы бы спели человеку, которого любите, но не можете к нему приблизиться?"}),d.jsx(V,{children:"— …ох, я бы сказал ей… я бы спел ей… прошу прощения… давайте просто оставим этот вопрос без ответа…."}),d.jsx(ft,{className:"prose-italics",children:"Он говорит это тихо, отводя взгляд. Некоторые вопросы остаются без ответов — и это тоже ответ."})]}),d.jsxs(Uu,{id:"ch4",variant:"dark",children:[d.jsx(Ka,{num:"Глава IV",title:"Популярность и её цена"}),d.jsx(ft,{children:"Популярность — это странная страна, в которой никто не объяснил правила до того, как ты туда попал. Он говорит об этом без жалоб и без восхищения. Просто — как о том, что есть."}),d.jsx(Z,{children:"— Что вы чувствуете, когда понимаете, что ваши песни сопровождают людей в очень личные моменты их жизни?"}),d.jsx(V,{children:"— Чувствую, что не зря Всевышний позволил мне жить на этом свете. Если мои строчки задевают струны чьего-то сердца, я безмерно счастлив. Именно тогда.. счастлив… ни после «ты лучший и самый красивый», а после слов: «твои строки были рядом, когда мне было плохо». Тогда."}),d.jsx(Aa,{children:"Если мои строчки задевают струны чьего-то сердца, я безмерно счастлив."}),d.jsx(Z,{children:"— Популярность подарила вам больше свободы или, наоборот, больше ограничений?"}),d.jsx(V,{children:"— Я всегда был и останусь свободным. И наши продюсеры это знают. В этом смысле, меня вовсе не страшит осуждение кого бы то ни было. Меня любят за то, какой я есть. В мире шоубизнеса идёт постоянно война за рейтинг и цифры… я же предпочитаю музыку.. честную и откровенную."}),d.jsx(Z,{children:"— Существует ли разница между тем айдолом, которого видят поклонники, и вами настоящим?"}),d.jsx(V,{children:"— И да, и нет. И это «нет»
